# قاعدة بيانات PostgreSQL للتطوير المحلي.
#   docker compose up -d
# ثم في .env :
#   DATABASE_URL="postgresql://postgres:postgres@localhost:5432/mtc_invitations?schema=public"
services:
  db:
    image: postgres:16-alpine
    container_name: mtc-invitations-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mtc_invitations
    ports:
      - "5432:5432"
    volumes:
      - mtc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mtc-pgdata:
